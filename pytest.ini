[pytest]
# Restrict collection to the test_*.py convention this project actually
# uses. pytest's default also matches *_test.py, which collided with
# run_full_population_test.py (a live-network script with an interactive
# prompt) getting silently imported and executed during `pytest`
# collection — see run_full_population_check.py's docstring. This closes
# that class of bug for good rather than relying on every future script
# name avoiding the *_test.py suffix by convention.
python_files = test_*.py
